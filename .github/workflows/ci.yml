name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and removed in the same PR is still
          # a secret that reached the remote.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan working tree
        run: node scripts/scan-secrets.mjs $(git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.sql' '*.yml' '*.sh')

      - name: Scan commits introduced by this ref
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.sql' '*.env*' || true)
          if [ -n "$files" ]; then
            for f in $files; do
              git show "$head:$f" > "/tmp/$(echo "$f" | tr '/' '_')" 2>/dev/null || true
            done
            node scripts/scan-secrets.mjs /tmp/* || exit 1
          else
            echo "no reviewable files changed"
          fi

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci || npm install

      - name: Build web portals
        run: |
          for app in AdminPanel agent-portal service-portal merchant-portal website; do
            echo "::group::$app"
            npm --prefix "$app" run build
            echo "::endgroup::"
          done

      - name: Typecheck mobile app
        working-directory: mobile-app
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

  migrations:
    name: Migrations parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Checks for a UTF-8 BOM and parses each file with the PostgreSQL
      # grammar. Two migrations once shipped with a BOM and nothing caught it
      # until a push failed. Runnable locally: npm run check-migrations
      - name: Install
        run: npm ci || npm install

      - name: Validate migrations
        run: npm run check-migrations

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    # Secrets are not available to forked pull requests, and a skipped check is
    # better than a red one that nobody can fix.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The live database once carried three wide-open RLS policies that were
      # in no migration, while a policy that WAS in a migration was absent.
      # This compares the running schema against supabase/security-snapshot.json
      # and fails on any difference, plus on unconditional policies, anon-callable
      # SECURITY DEFINER functions and tables with RLS off.
      #
      # Accept an intended change with: npm run schema-snapshot -- --write
      - name: Check schema against committed snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — schema drift not checked."
            exit 0
          fi
          node scripts/schema-snapshot.mjs

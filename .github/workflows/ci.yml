name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and removed in the same PR is still
          # a secret that reached the remote.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan working tree
        run: node scripts/scan-secrets.mjs $(git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.sql' '*.yml' '*.sh')

      - name: Scan commits introduced by this ref
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.sql' '*.env*' || true)
          if [ -n "$files" ]; then
            for f in $files; do
              git show "$head:$f" > "/tmp/$(echo "$f" | tr '/' '_')" 2>/dev/null || true
            done
            node scripts/scan-secrets.mjs /tmp/* || exit 1
          else
            echo "no reviewable files changed"
          fi

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci || npm install

      - name: Build web portals
        run: |
          for app in AdminPanel agent-portal service-portal merchant-portal website; do
            echo "::group::$app"
            npm --prefix "$app" run build
            echo "::endgroup::"
          done

      - name: Typecheck mobile app
        working-directory: mobile-app
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

  migrations:
    name: Migrations parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Checks for a UTF-8 BOM and parses each file with the PostgreSQL
      # grammar. Two migrations once shipped with a BOM and nothing caught it
      # until a push failed. Runnable locally: npm run check-migrations
      - name: Install
        run: npm ci || npm install

      - name: Validate migrations
        run: npm run check-migrations

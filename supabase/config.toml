project_id = "milipay"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[edge_runtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.phone]
enable_signup = true

[auth.sms.twilio]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[analytics]
enabled = false

# JWT verification per function. Pinned here because a plain
# `supabase functions deploy` defaults it ON, and these two are called by
# things that hold no Supabase session: Mono (authenticated by
# MONO_WEBHOOK_SECRET) and pg_cron (authenticated by the Vault-held
# reconcile_secret). Turning it on would 401 every webhook and every sweep.
[functions.mono-webhook]
verify_jwt = false

[functions.vtu-reconcile]
verify_jwt = false

# Called by people who are not signed in yet (that is its whole job); it is
# rate-limited by phone and by address and issues nothing without the code.
[functions.login-code]
verify_jwt = false

# Self sign-up: the caller has no account yet. Every step after the phone
# code needs the resume token the code earns; all of it is rate-limited.
[functions.signup]
verify_jwt = false

# The POS terminal app. A terminal signs in with the merchant's phone and
# password and then carries its own device token and cashier session, checked
# by the function itself; it never holds a Supabase JWT.
[functions.pos]
verify_jwt = false

# The marketing website's waitlist, applications and agent list. Visitors
# have no account; every write is validated and rate-limited by address.
[functions.website]
verify_jwt = false

# Smile ID results. Authenticated by Smile ID's Response-Signature (HMAC
# with the API key), checked before the body is read.
[functions.smile-webhook]
verify_jwt = false

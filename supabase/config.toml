project_id = "milipay"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[edge_runtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.phone]
enable_signup = true

[auth.sms.twilio]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[analytics]
enabled = false

# JWT verification per function. Pinned here because a plain
# `supabase functions deploy` defaults it ON, and these two are called by
# things that hold no Supabase session: Mono (authenticated by
# MONO_WEBHOOK_SECRET) and pg_cron (authenticated by the Vault-held
# reconcile_secret). Turning it on would 401 every webhook and every sweep.
[functions.mono-webhook]
verify_jwt = false

[functions.vtu-reconcile]
verify_jwt = false

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-cropped.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try { var t = localStorage.getItem("milipay.theme.agent"); document.documentElement.dataset.theme = t === "light" ? "light" : "dark"; }
      catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
    <title>MiliPay Agent Portal</title>
    <meta name="description" content="Manage registered customers and monitor transactions." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
